x-kafka-common-env: &kafka-common-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

x-cassandra-env: &cassandra-env
  CASSANDRA_CLUSTER_NAME: AutoIndexerCluster
  CASSANDRA_SEEDS: cassandra-1
  MAX_HEAP_SIZE: 512M # to avoid my laptop running out of RAM
  HEAP_NEWSIZE: 100M

services:
  kafka-1:
    image: apache/kafka:4.1.1
    user: root
    container_name: kafka-1
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka1_data:/tmp/kafka-logs

  kafka-2:
    image: apache/kafka:4.1.1
    user: root
    container_name: kafka-2
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka2_data:/tmp/kafka-logs

  cassandra-1:
    image: cassandra:5.0.6
    container_name: cassandra-1
    environment:
      <<: *cassandra-env
    volumes:
      - cass1_data:/var/lib/cassandra

  cassandra-2:
    image: cassandra:5.0.6
    container_name: cassandra-2
    environment:
      <<: *cassandra-env
    volumes:
      - cass2_data:/var/lib/cassandra
    depends_on:
      - cassandra-1

  spark-master:
    image: apache/spark:3.5.0-python3
    user: root
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker-1:
    image: apache/spark:3.5.0-python3
    user: root
    container_name: spark-worker-1
    environment:
    - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - spark_checkpoints:/opt/spark-apps/checkpoints
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  postgres:
    image: postgres:15.15-trixie
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=testdb
    command: >
      postgres 
      -c log_statement=all 
      -c logging_collector=on 
      -c log_directory=/var/log/postgresql 
      -c log_filename=postgresql.log
    volumes:
      - pg_logs:/var/log/postgresql
      - postgres_data:/var/lib/postgresql/data

  watcher:
    image: auto-indexing-watcher:latest
    container_name: watcher
    depends_on:
      - kafka-1
      - postgres
    volumes:
      - pg_logs:/var/log/postgresql:ro
    environment:
      - KAFKA_BROKERS=kafka-1:9092,kafka-2:9092       # Required. Comma separated list of kafka brokers, used for bootstrap servers.
      - LOG_PATH=/var/log/postgresql/postgresql.log   # Required. Absolute path to the postgres log file inside the container.
      - KAFKA_TOPIC=query-logs                        # Optional. Default: query-logs. The Kafka topic to produce query logs to.
      - KAFKA_REPLICATION_FACTOR=2                    # Optional. Default: 2. Replication factor for the Kafka topic if it needs to be created.

  actuator:
    image: auto-indexing-actuator:latest
    container_name: actuator
    depends_on:
      - cassandra-1
      - cassandra-2
      - postgres
    environment:
      - DB_HOST=postgres                              # Required. Hostname of the Postgres database.
      - DB_NAME=testdb                                # Required. Name of the Postgres database.
      - DB_USER=admin                                 # Required. Username for the Postgres database.
      - DB_PASS=password                              # Required. Password for the Postgres database.
      - CASSANDRA_HOSTS=cassandra-1,cassandra-2       # Required. Comma separated list of Cassandra hosts.
      - DB_PORT=5432                                  # Optional. Default: 5432. Port of the Postgres database.
      - CASSANDRA_KEYSPACE=index_optimizer            # Optional. Default: index_optimizer. Cassandra keyspace to use.
      - CASSANDRA_REPLICATION_FACTOR=2                # Optional. Default: 2. Replication factor for the Cassandra keyspace.
      - CREATE_THRESHOLD=40                           # Optional. Default: 50. Minimum query count required to trigger index creation.
      - DELETE_THRESHOLD=5                            # Optional. Default: 5. Maximum query count to consider an index for deletion.
      - LOOKBACK_CREATE=15                            # Optional. Default: 30. Time window in minutes to look back for index creation statistics.
      - LOOKBACK_DELETE=120                           # Optional. Default: 120. Time window in minutes to look back for index deletion statistics.
      - WRITE_RATIO_THRESHOLD=4.0                     # Optional. Default: 2.0 Max ratio of writes to reads allowed before skipping index creation on a column.
      - TABLE_SIZE_THRESHOLD=5                        # Optional. Default: 10. Minimum number of pages a table must have to consider indexing.
      - CARDINALITY_RATIO_THRESHOLD=0.05              # Optional. Default: 0.05. Minimum ratio of distinct values to total rows required for indexing.

  spark-stream:
    image: auto-indexing-spark-stream:latest
    container_name: spark-submit
    depends_on:
      - cassandra-1
      - cassandra-2
      - kafka-1
      - spark-master
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077    # Required. URL of the Spark master.
      - KAFKA_BROKERS=kafka-1:9092,kafka-2:9092       # Required. Comma separated list of Kafka brokers.
      - CASSANDRA_HOSTS=cassandra-1,cassandra-2       # Required. Comma separated list of Cassandra hosts.
      - KAFKA_TOPIC=query-logs                        # Optional. Default: query-logs. Kafka topic to consume query logs from.
      - CASSANDRA_KEYSPACE=index_optimizer            # Optional. Default: index_optimizer. Cassandra keyspace to write stats to.
      - CASSANDRA_TABLE=query_stats                   # Optional. Default: query_stats. Cassandra table to write stats to.
      - SPARK_WINDOW_SIZE=1 minute                    # Optional. Default: 10 minutes. The size of the tumbling window for query aggregation.
      - SPARK_WATERMARK_SIZE=5 minutes                # Optional. Default: 1 hour. The watermark duration for handling late data.
    volumes:
      - spark_checkpoints:/opt/spark-apps/checkpoints

volumes:
  kafka1_data:
  kafka2_data:
  cass1_data:
  cass2_data:
  postgres_data:
  pg_logs:
  spark_checkpoints: