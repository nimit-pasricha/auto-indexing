# TODO: create environment vars with all defaults

x-kafka-common: &kafka-common
  image: apache/kafka:4.1.1
  user: root

x-kafka-common-environment: &kafka-common-environment
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

x-cassandra-common: &cassandra-common
  image: cassandra:5.0.6
  environment:
    - CASSANDRA_CLUSTER_NAME=AutoIndexerCluster
    - CASSANDRA_SEEDS=cassandra-1

x-spark-common: &spark-common
  image: apache/spark:3.5.0-python3
  environment:
    - SPARK_MASTER=spark://spark-master:7077

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    environment:
      <<: *kafka-common-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka1_data:/tmp/kafka-logs

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    environment:
      <<: *kafka-common-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka2_data:/tmp/kafka-logs

  cassandra-1:
    <<: *cassandra-common
    container_name: cassandra-1
    volumes:
      - cass1_data:/var/lib/cassandra

  cassandra-2:
    <<: *cassandra-common
    container_name: cassandra-2
    depends_on:
      - cassandra-1
    volumes:
      - cass2_data:/var/lib/cassandra

  spark-master:
    <<: *spark-common
    container_name: spark-master
    ports:
      - "8080:8080" # Web UI
      - "7077:7077"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  postgres:
    image: postgres:15.15-trixie
    container_name: postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=testdb
    command: >
      postgres 
      -c log_statement=all 
      -c logging_collector=on 
      -c log_directory=/var/log/postgresql 
      -c log_filename=postgresql.log
    volumes:
      - pg_logs:/var/log/postgresql # Shared with Watcher
      - postgres_data:/var/lib/postgresql/data # Persistent User Dat

  watcher:
    image: auto-index-watcher:1.0
    container_name: watcher
    volumes:
      - pg_logs:/var/log/postgresql:ro # Only needs the logs
    environment:
      - KAFKA_BROKERS=kafka-1:9092,kafka-2:9092
      - LOG_PATH=/var/log/postgresql/postgresql.log

  actuator:
    image: auto-index-actuator:1.0
    container_name: actuator
    environment:
      - DB_HOST=postgres
      - DB_NAME=testdb
      - DB_USER=admin
      - DB_PASS=password
      - CASSANDRA_HOSTS=cassandra-1,cassandra-2

  spark-stream:
    image: auto-index-spark-stream:1.0
    container_name: spark-submit
    depends_on:
      - spark-master
      - spark-worker-1
      - kafka-1
      - cassandra-1
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - KAFKA_BROKERS=kafka-1:9092,kafka-2:9092
      - CASSANDRA_HOSTS=cassandra-1,cassandra-2
    volumes:
      - spark_checkpoints:/opt/spark-apps/checkpoints

volumes:
  kafka1_data:
  kafka2_data:
  cass1_data:
  cass2_data:
  postgres_data:
  pg_logs:
  spark_checkpoints:
