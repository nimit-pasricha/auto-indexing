x-kafka-common-env: &kafka-common-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

x-cassandra-env: &cassandra-env
  CASSANDRA_CLUSTER_NAME: AutoIndexerCluster
  CASSANDRA_SEEDS: cassandra-1
  MAX_HEAP_SIZE: 512M # to avoid laptop is running out of RAM
  HEAP_NEWSIZE: 100M

services:
  kafka-1:
    image: apache/kafka:4.1.1
    user: root
    container_name: kafka-1
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka1_data:/tmp/kafka-logs

  kafka-2:
    image: apache/kafka:4.1.1
    user: root
    container_name: kafka-2
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka2_data:/tmp/kafka-logs

  cassandra-1:
    image: cassandra:5.0.6
    container_name: cassandra-1
    environment:
      <<: *cassandra-env
    volumes:
      - cass1_data:/var/lib/cassandra

  cassandra-2:
    image: cassandra:5.0.6
    container_name: cassandra-2
    environment:
      <<: *cassandra-env
    volumes:
      - cass2_data:/var/lib/cassandra
    depends_on:
      - cassandra-1

  spark-master:
    image: apache/spark:3.5.0-python3
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker-1:
    image: apache/spark:3.5.0-python3
    container_name: spark-worker-1
    environment:
    - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  postgres:
    image: postgres:15.15-trixie
    container_name: postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=testdb
    command: >
      postgres 
      -c log_statement=all 
      -c logging_collector=on 
      -c log_directory=/var/log/postgresql 
      -c log_filename=postgresql.log
    volumes:
      - pg_logs:/var/log/postgresql
      - postgres_data:/var/lib/postgresql/data

  watcher:
    build:
      context: .
      dockerfile: Dockerfile.watcher
    container_name: watcher
    depends_on:
      - kafka-1
      - postgres
    volumes:
      - pg_logs:/var/log/postgresql:ro
    environment:
      - KAFKA_BROKERS=kafka-1:9092,kafka-2:9092
      - LOG_PATH=/var/log/postgresql/postgresql.log
      - KAFKA_REPLICATION_FACTOR=2

  actuator:
    build:
      context: .
      dockerfile: Dockerfile.actuator
    container_name: actuator
    depends_on:
      - cassandra-1
      - cassandra-2
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_NAME=testdb
      - DB_USER=admin
      - DB_PASS=password
      - CASSANDRA_HOSTS=cassandra-1,cassandra-2
      - CASSANDRA_REPLICATION_FACTOR=2

  spark-stream:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-submit
    depends_on:
      - cassandra-1
      - cassandra-2
      - kafka-1
      - spark-master
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - KAFKA_BROKERS=kafka-1:9092,kafka-2:9092
      - CASSANDRA_HOSTS=cassandra-1,cassandra-2
    volumes:
      - spark_checkpoints:/opt/spark-apps/checkpoints

volumes:
  kafka1_data:
  kafka2_data:
  cass1_data:
  cass2_data:
  postgres_data:
  pg_logs:
  spark_checkpoints: